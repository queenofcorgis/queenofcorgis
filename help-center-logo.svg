<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <!-- Background gradient: deep purple to hot pink, like the sky in the image -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B0AC9;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#D4008F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B35;stop-opacity:1" />
    </linearGradient>

    <!-- Ocean teal gradient for the wave band -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0072FF;stop-opacity:1" />
    </linearGradient>

    <!-- Headset body gradient: blue dolphin inspired -->
    <linearGradient id="headsetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00CFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B2FFF;stop-opacity:1" />
    </linearGradient>

    <!-- Star shimmer gradient -->
    <radialGradient id="starGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE000;stop-opacity:0.7" />
    </radialGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#7B2FFF" flood-opacity="0.5"/>
    </filter>

    <!-- Text rainbow gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="30%"  style="stop-color:#00FFEE;stop-opacity:1" />
      <stop offset="60%"  style="stop-color:#FF61D2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE000;stop-opacity:1" />
    </linearGradient>

    <!-- Sub-text gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#FF61D2" />
      <stop offset="100%" style="stop-color:#00FFEE" />
    </linearGradient>

    <!-- Bubble shimmer -->
    <radialGradient id="bubbleGrad" cx="35%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#00E5FF;stop-opacity:0.2"/>
    </radialGradient>

    <!-- Beach-ball rainbow slices -->
    <linearGradient id="ballR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF3CAC"/>
      <stop offset="100%" style="stop-color:#FF3CAC"/>
    </linearGradient>
  </defs>

  <!-- ═══ BACKGROUND ═══ -->
  <rect width="400" height="200" fill="url(#bgGrad)" rx="18" ry="18"/>

  <!-- Subtle cloud puffs (white, low opacity) -->
  <ellipse cx="60"  cy="28" rx="30" ry="14" fill="white" opacity="0.18"/>
  <ellipse cx="85"  cy="22" rx="22" ry="12" fill="white" opacity="0.18"/>
  <ellipse cx="330" cy="25" rx="28" ry="13" fill="white" opacity="0.15"/>
  <ellipse cx="355" cy="19" rx="20" ry="11" fill="white" opacity="0.15"/>

  <!-- ═══ OCEAN WAVE BAND ═══ -->
  <path d="M0,155 Q50,140 100,155 Q150,170 200,155 Q250,140 300,155 Q350,170 400,155 L400,200 L0,200 Z"
        fill="url(#waveGrad)" opacity="0.55"/>
  <path d="M0,165 Q60,150 120,165 Q180,180 240,165 Q300,150 360,165 Q380,172 400,165 L400,200 L0,200 Z"
        fill="#0047AB" opacity="0.4"/>

  <!-- Foam line sparkles on wave -->
  <circle cx="45"  cy="154" r="2.5" fill="white" opacity="0.8"/>
  <circle cx="110" cy="162" r="2"   fill="white" opacity="0.7"/>
  <circle cx="200" cy="153" r="3"   fill="white" opacity="0.85"/>
  <circle cx="270" cy="161" r="2"   fill="white" opacity="0.7"/>
  <circle cx="355" cy="155" r="2.5" fill="white" opacity="0.8"/>

  <!-- ═══ FLOATING BUBBLES (background, scattered) ═══ -->
  <circle cx="20"  cy="80"  r="6"  fill="url(#bubbleGrad)" stroke="#00FFEE" stroke-width="0.8" opacity="0.7"/>
  <circle cx="35"  cy="140" r="4"  fill="url(#bubbleGrad)" stroke="#FF61D2" stroke-width="0.8" opacity="0.6"/>
  <circle cx="375" cy="70"  r="5"  fill="url(#bubbleGrad)" stroke="#00FFEE" stroke-width="0.8" opacity="0.7"/>
  <circle cx="388" cy="120" r="3.5" fill="url(#bubbleGrad)" stroke="#FFE000" stroke-width="0.8" opacity="0.6"/>
  <circle cx="15"  cy="120" r="3"  fill="url(#bubbleGrad)" stroke="#FF61D2" stroke-width="0.7" opacity="0.5"/>

  <!-- ═══ BEACH BALL (top right, Lisa Frank accent) ═══ -->
  <g transform="translate(362, 34)" filter="url(#glow)">
    <circle cx="0" cy="0" r="18" fill="#FFE000" opacity="0.95"/>
    <!-- Colourful slices -->
    <path d="M0,0 L0,-18 A18,18 0 0,1 15.6,9 Z"  fill="#FF3CAC" opacity="0.9"/>
    <path d="M0,0 L15.6,9 A18,18 0 0,1 -15.6,9 Z" fill="#00CFFF" opacity="0.9"/>
    <path d="M0,0 L-15.6,9 A18,18 0 0,1 0,-18 Z"  fill="#7BFF6A" opacity="0.9"/>
    <!-- Shine -->
    <ellipse cx="-5" cy="-8" rx="5" ry="3" fill="white" opacity="0.45" transform="rotate(-20,-5,-8)"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="white" stroke-width="1.2" opacity="0.4"/>
  </g>

  <!-- ═══ HEADSET ICON ═══ -->
  <!-- Arc / band -->
  <path d="M108,90 A50,50 0 0,1 208,90"
        fill="none" stroke="url(#headsetGrad)" stroke-width="9" stroke-linecap="round"
        filter="url(#glow)"/>
  <!-- Left ear cup -->
  <rect x="100" y="88" width="18" height="26" rx="7" ry="7" fill="url(#headsetGrad)" filter="url(#glow)"/>
  <!-- Right ear cup -->
  <rect x="198" y="88" width="18" height="26" rx="7" ry="7" fill="url(#headsetGrad)" filter="url(#glow)"/>
  <!-- Left inner ear highlight -->
  <rect x="104" y="92" width="10" height="14" rx="4" ry="4" fill="#FF61D2" opacity="0.65"/>
  <!-- Right inner ear highlight -->
  <rect x="202" y="92" width="10" height="14" rx="4" ry="4" fill="#FF61D2" opacity="0.65"/>
  <!-- Mic boom arm -->
  <path d="M206,110 Q218,118 216,128" fill="none" stroke="url(#headsetGrad)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Mic capsule -->
  <ellipse cx="215" cy="131" rx="7" ry="5" fill="#FFE000" filter="url(#glow)"/>
  <ellipse cx="215" cy="131" rx="4" ry="3" fill="white" opacity="0.6"/>

  <!-- Headset shimmer highlight on arc -->
  <path d="M118,80 A50,50 0 0,1 180,78"
        fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.35"/>

  <!-- ═══ SPARKLE STARS (scattered) ═══ -->
  <!-- 4-point star helper drawn as paths -->
  <!-- Star 1 -->
  <g transform="translate(80,45)" filter="url(#glow)">
    <polygon points="0,-8 2,-2 8,0 2,2 0,8 -2,2 -8,0 -2,-2" fill="url(#starGrad)" opacity="0.95"/>
  </g>
  <!-- Star 2 -->
  <g transform="translate(305,50)" filter="url(#glow)">
    <polygon points="0,-6 1.5,-1.5 6,0 1.5,1.5 0,6 -1.5,1.5 -6,0 -1.5,-1.5" fill="#FF61D2" opacity="0.9"/>
  </g>
  <!-- Star 3 -->
  <g transform="translate(340,90)" filter="url(#glow)">
    <polygon points="0,-5 1.2,-1.2 5,0 1.2,1.2 0,5 -1.2,1.2 -5,0 -1.2,-1.2" fill="#00FFEE" opacity="0.85"/>
  </g>
  <!-- Star 4 -->
  <g transform="translate(55,95)" filter="url(#glow)">
    <polygon points="0,-5 1.2,-1.2 5,0 1.2,1.2 0,5 -1.2,1.2 -5,0 -1.2,-1.2" fill="#FFE000" opacity="0.9"/>
  </g>
  <!-- Star 5 -->
  <g transform="translate(155,48)" filter="url(#glow)">
    <polygon points="0,-4 1,-1 4,0 1,1 0,4 -1,1 -4,0 -1,-1" fill="white" opacity="0.8"/>
  </g>

  <!-- ═══ MAIN TITLE TEXT ═══ -->
  <text x="200" y="138"
        font-family="'Arial Rounded MT Bold', 'Arial Black', sans-serif"
        font-size="28"
        font-weight="900"
        text-anchor="middle"
        fill="url(#textGrad)"
        filter="url(#shadow)"
        letter-spacing="1.5">HELP CENTER</text>

  <!-- Text outline for pop -->
  <text x="200" y="138"
        font-family="'Arial Rounded MT Bold', 'Arial Black', sans-serif"
        font-size="28"
        font-weight="900"
        text-anchor="middle"
        fill="none"
        stroke="#7B2FFF"
        stroke-width="3"
        stroke-linejoin="round"
        letter-spacing="1.5"
        opacity="0.45">HELP CENTER</text>

  <!-- ═══ TAGLINE ═══ -->
  <text x="200" y="157"
        font-family="'Arial Rounded MT Bold', Arial, sans-serif"
        font-size="11"
        font-weight="700"
        text-anchor="middle"
        fill="url(#subGrad)"
        letter-spacing="3"
        filter="url(#glow)">WE'RE HERE FOR YOU ✦</text>

  <!-- ═══ BORDER DECORATION ═══ -->
  <rect width="400" height="200" fill="none" rx="18" ry="18"
        stroke="url(#textGrad)" stroke-width="3" opacity="0.6"/>
  <!-- Inner border -->
  <rect x="5" y="5" width="390" height="190" fill="none" rx="14" ry="14"
        stroke="white" stroke-width="1" opacity="0.2"/>
</svg>